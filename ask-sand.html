<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fafbf7">
<title>Thailand Boat Festival 2027 — ทราย พร้อมช่วย</title>
<meta name="description" content="Sand · AI Concierge for Thailand Boat Festival 2027 at Boat Lagoon Marina, Phuket. Ask in any language.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg:          #fafbf7;
    --bg-card:     #ffffff;
    --bg-soft:     #f5edd6;
    --ink:         #0b1220;
    --ink-soft:    #5c6770;
    --ink-faint:   #8fa0ae;
    --line:        #e5e9df;
    --line-strong: #d8d4c3;
    --gold:        #b8902e;
    --gold-dark:   #8a6d1f;
    --gold-soft:   #d9b558;
    --gold-tint:   rgba(184, 144, 46, 0.08);
    --gold-tint-2: rgba(184, 144, 46, 0.18);
    --gold-tint-3: rgba(184, 144, 46, 0.30);
    --gold-bg:     #f7f0dc;
    --user-bg:     #0b1220;
    --user-fg:     #ffffff;
    --bot-bg:      #ffffff;
    --bot-fg:      #0b1220;
    --shadow-sm:   0 1px 2px rgba(11,18,32,0.06);
    --shadow-md:   0 4px 14px rgba(11,18,32,0.07), 0 1px 3px rgba(11,18,32,0.04);
    --shadow-glow: 0 2px 10px rgba(184, 144, 46, 0.22);
    --radius-sm:   10px;
    --radius-md:   16px;
    --radius-lg:   18px;
    --font:        'Inter', 'IBM Plex Sans Thai Looped', 'Sukhumvit Set', 'Leelawadee UI', 'Thonburi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    line-height: 1.6;
    display: flex; flex-direction: column;
    overflow-x: hidden;
    position: relative;
}
:lang(th) .bubble,
.bubble:lang(th) { line-height: 1.72; }

/* ─── PARTICLES (decorative floating gold orbs) ─── */
.particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.particle {
    position: absolute;
    border-radius: 50%;
    background-image: radial-gradient(circle, rgba(184, 144, 46, 0.10) 0%, rgba(184, 144, 46, 0) 70%);
    animation: drift 18s ease-in-out infinite;
}
.particle.p1 { width: 220px; height: 220px; top:  8%; left:  6%; animation-delay:  0s; }
.particle.p2 { width: 160px; height: 160px; top: 28%; right:  8%; animation-delay: -4s; animation-duration: 22s; }
.particle.p3 { width: 280px; height: 280px; bottom: 12%; left: 14%; animation-delay: -8s; animation-duration: 26s; }
.particle.p4 { width: 140px; height: 140px; top: 58%; right: 18%; animation-delay: -2s; animation-duration: 20s; }
.particle.p5 { width: 200px; height: 200px; bottom: 28%; right:  4%; animation-delay: -10s; animation-duration: 24s; }
.particle.p6 { width: 120px; height: 120px; top: 45%; left: 40%; animation-delay: -6s; animation-duration: 28s; opacity: 0.7; }
@keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    33%      { transform: translate(20px, -25px); }
    66%      { transform: translate(-15px, 18px); }
}

/* ─── HEADER ─── */
.bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1.2rem;
    background-image: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 2px rgba(11, 18, 32, 0.06);
    gap: 0.9rem;
}
.bar-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
.agent-avatar-wrap { position: relative; flex-shrink: 0; }
.agent-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold-soft);
    box-shadow: var(--shadow-glow);
    display: block;
}
.online-dot {
    position: absolute; right: 1px; bottom: 1px;
    width: 10px; height: 10px; border-radius: 50%;
    background: #1fba5a;
    box-shadow: 0 0 0 2.5px var(--bg-card), 0 0 0 4px rgba(31, 186, 90, 0.22);
    animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 2.5px var(--bg-card), 0 0 0 4px rgba(31, 186, 90, 0.22); }
    50%      { box-shadow: 0 0 0 2.5px var(--bg-card), 0 0 0 6px rgba(31, 186, 90, 0.12); }
}
.agent-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.agent-name-row { display: flex; align-items: baseline; gap: 0.45rem; flex-wrap: wrap; }
.agent-name { font-size: 0.98rem; font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; }
.app-version { font-size: 0.7rem; color: var(--ink-faint); font-weight: 500; letter-spacing: 0.05em; }
.agent-sub { font-size: 0.75rem; color: var(--ink-soft); line-height: 1.15; }

.lang-wrap { position: relative; flex-shrink: 0; }
.lang-btn {
    padding: 0.42rem 0.8rem;
    border-radius: 14px;
    border: 1px solid var(--gold-tint-3);
    background: var(--gold-bg);
    font-family: var(--font); font-size: 0.78rem; font-weight: 600;
    color: var(--gold-dark); cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 0.35rem;
}
.lang-btn:hover { background: #efe2bd; }
.lang-btn .caret { font-size: 0.55rem; opacity: 0.6; }
.lang-menu {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    min-width: 180px; padding: 0.3rem;
    display: none; z-index: 30;
    max-height: 70vh; overflow-y: auto;
}
.lang-menu.open { display: block; }
.lang-item {
    width: 100%; text-align: left;
    padding: 0.55rem 0.7rem; border: 0; background: transparent;
    border-radius: 8px;
    font-family: var(--font); font-size: 0.85rem; color: var(--ink);
    cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
}
.lang-item:hover { background: var(--bg-soft); }
.lang-item.active { background: var(--gold-tint); color: var(--gold-dark); font-weight: 600; }
.lang-item .flag { font-size: 1rem; }

/* ─── CHAT (always visible, no separate welcome) ─── */
.chat {
    flex: 1; display: flex; flex-direction: column;
    max-width: 760px; width: 100%; margin: 0 auto;
    padding: 0 1.2rem;
    overflow: hidden;
    position: relative; z-index: 1;
}
.messages {
    flex: 1; overflow-y: auto;
    padding: 1.4rem 0.4rem 1rem;
    display: flex; flex-direction: column; gap: 1rem;
    scroll-behavior: smooth;
}

/* ─── MESSAGE ─── */
.msg { display: flex; gap: 0.6rem; max-width: 100%; align-items: flex-end; }
.msg.user { justify-content: flex-end; }
.msg-av {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0; object-fit: cover;
    border: 1.5px solid var(--gold-soft);
    margin-bottom: 2px;
}
.user-stack {
    display: flex; flex-direction: column; align-items: flex-end;
    max-width: calc(100% - 50px);
}
.user-label {
    font-size: 0.72rem; color: var(--ink-soft); font-weight: 500;
    letter-spacing: 0.04em;
    margin: 0 0.5rem 3px 0;
}
.bubble {
    padding: 0.75rem 1rem;
    font-size: 0.94rem;
    max-width: 100%;
    word-wrap: break-word;
    white-space: pre-wrap;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
}
.msg.bot .bubble { max-width: calc(100% - 50px); }
.msg.bot .bubble {
    background: var(--bot-bg); color: var(--bot-fg);
    border-radius: 18px 18px 18px 4px;
}
.msg.user .bubble {
    background: var(--user-bg); color: var(--user-fg);
    border-radius: 18px 18px 4px 18px;
    border-color: transparent;
}
/* Typing bubble — compact single-line dots only */
.msg.bot.typing-msg .bubble { padding: 0.55rem 0.85rem; }
.dots { display: inline-flex; gap: 5px; align-items: center; line-height: 1; }
.dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold-soft);
    animation: dot-pulse 1.3s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse {
    0%, 60%, 100% { opacity: 0.35; transform: scale(0.85); }
    30%           { opacity: 1;    transform: scale(1); }
}

/* ─── SUGGESTION CHIPS (Fah-style pills) ─── */
.suggestions {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin: 0.1rem 0 0;
    padding-left: 40px;  /* aligns under bot bubble (avatar 32 + gap 8) */
}
.suggest-chip {
    padding: 0.45rem 0.85rem;
    background: var(--gold-tint);
    border: 1px solid var(--gold-tint-3);
    border-radius: 18px;
    font-family: var(--font);
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--gold-dark);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.35;
}
.suggest-chip:hover  { background: var(--gold-tint-2); transform: translateY(-1px); }
.suggest-chip:active { transform: translateY(0); }

/* ─── LEAD CARD ─── */
.lead-card {
    margin: 0.4rem 0;
    background: var(--bg-card);
    border: 1px solid var(--gold-soft);
    border-radius: var(--radius-md);
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow-md);
    max-width: calc(100% - 50px);
}
.lead-card-h {
    font-size: 0.74rem; color: var(--gold-dark); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 0.7rem;
}
.lead-row { display: flex; gap: 0.5rem; padding: 0.32rem 0; font-size: 0.88rem; line-height: 1.4; }
.lead-row .k { color: var(--ink-soft); min-width: 78px; flex-shrink: 0; }
.lead-row .v { font-weight: 500; }
.lead-actions { display: flex; gap: 0.5rem; margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid var(--line); }
.btn-confirm, .btn-edit {
    flex: 1; padding: 0.7rem 1rem;
    border: 0; border-radius: var(--radius-sm);
    font-family: var(--font); font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
}
.btn-confirm { background: var(--ink); color: #fff; }
.btn-confirm:hover { background: #1a2336; }
.btn-edit { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.btn-edit:hover { border-color: var(--ink-soft); color: var(--ink); }
.lead-sent { display: none; padding: 0.85rem; text-align: center; color: #2d7a4f; font-weight: 600; background: #ecf7ee; border-radius: var(--radius-sm); margin-top: 0.85rem; font-size: 0.9rem; }
.lead-card.sent .lead-actions { display: none; }
.lead-card.sent .lead-sent { display: block; }

/* ─── INPUT ─── */
.input-area {
    width: 100%;
    padding: 0.85rem 1.2rem 1rem;
    background: var(--bg-card);
    box-shadow: 0 -2px 12px rgba(11, 18, 32, 0.05);
    position: relative; z-index: 5;
}
.input-shell {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 0.5rem;
    background: var(--bg-card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 0.55rem 0.6rem 0.55rem 1rem;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.input-shell:focus-within {
    border-color: var(--gold-soft);
    box-shadow: 0 0 0 3px var(--gold-tint);
}
.input-field {
    flex: 1;
    border: 0; outline: 0; background: transparent;
    font-family: var(--font); font-size: 0.95rem; color: var(--ink);
    padding: 0.35rem 0; resize: none;
    max-height: 120px; line-height: 1.45;
}
.input-field::placeholder { color: var(--ink-faint); }
.send-btn {
    width: 34px; height: 34px; border: 0;
    border-radius: 10px;
    background: var(--ink); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
}
.send-btn:disabled { background: var(--line-strong); cursor: not-allowed; }
.send-btn:not(:disabled):hover { background: var(--gold-dark); }
.send-btn svg { width: 15px; height: 15px; }
.input-hint {
    max-width: 760px; margin: 0.5rem auto 0;
    font-size: 0.7rem; color: var(--ink-faint);
    text-align: center;
}

.footer {
    text-align: center;
    padding: 0.55rem 1rem;
    font-size: 0.68rem; color: var(--ink-faint);
    background: var(--bg);
    position: relative; z-index: 5;
}
.footer a { color: var(--ink-soft); text-decoration: none; }
.footer a:hover { color: var(--gold); }

/* ─── SPLASH (initial loading) ─── */
.splash {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.45s ease-out;
}
.splash.hidden { opacity: 0; pointer-events: none; }
.splash-inner { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.splash-img {
    width: 106px; height: 106px; border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold-soft);
    box-shadow: 0 6px 28px rgba(184,144,46,0.22), 0 0 0 6px rgba(184,144,46,0.05);
    animation: splash-float 2.2s ease-in-out infinite;
}
.splash-label {
    font-family: var(--font);
    font-size: 0.82rem; color: var(--ink-soft);
    letter-spacing: 0.04em;
    animation: splash-fade 1.6s ease-in-out infinite;
}
@keyframes splash-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
}
@keyframes splash-fade {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.9; }
}

/* ─── MOBILE ─── */
@media (max-width: 520px) {
    .bar { padding: 0.7rem 0.9rem; gap: 0.5rem; }
    .agent-avatar { width: 40px; height: 40px; }
    .agent-name { font-size: 0.92rem; }
    .agent-sub  { font-size: 0.7rem; }
    .app-version { display: none; }
    .lang-btn { padding: 0.4rem 0.7rem; font-size: 0.72rem; }
    .chat { padding: 0 0.7rem; }
    .messages { padding-top: 1rem; gap: 0.85rem; }
    .suggestions { padding-left: 0; gap: 0.4rem; }
    .suggest-chip { font-size: 0.8rem; padding: 0.42rem 0.78rem; }
    .input-area { padding: 0.7rem 0.85rem 0.85rem; }
    .particle.p1 { width: 140px; height: 140px; }
    .particle.p2 { width: 100px; height: 100px; }
    .particle.p3 { width: 180px; height: 180px; }
    .particle.p4 { display: none; }
    .particle.p5 { width: 140px; height: 140px; }
    .particle.p6 { display: none; }
}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
    <div class="splash-inner">
        <img src="images/sand_profile_pic.png" alt="" class="splash-img">
        <div class="splash-label" id="splashLabel">ทราย กำลังเตรียมพร้อม…</div>
    </div>
</div>

<!-- PARTICLES (decorative bg) -->
<div class="particles" aria-hidden="true">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
</div>

<!-- HEADER -->
<div class="bar">
    <div class="bar-left">
        <div class="agent-avatar-wrap">
            <img src="images/sand_profile_pic.png" alt="Sand" class="agent-avatar" id="barAvatar">
            <span class="online-dot" aria-hidden="true"></span>
        </div>
        <div class="agent-info">
            <div class="agent-name-row">
                <span class="agent-name" id="barH1">Sand · AI Concierge</span>
                <span class="app-version" id="appVersion">V.1.0</span>
            </div>
            <div class="agent-sub" id="barSub">Thailand Boat Festival 2027 · Online</div>
        </div>
    </div>
    <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" onclick="toggleLangMenu(event)">
            <span id="langLabel">🌐 Auto</span><span class="caret">▾</span>
        </button>
        <div class="lang-menu" id="langMenu">
            <button class="lang-item" data-lang="auto" onclick="setLang('auto')"><span class="flag">🌐</span> Auto-detect</button>

            <button class="lang-item" data-lang="vi"   onclick="setLang('vi')"><span class="flag">🇻🇳</span> Tiếng Việt</button>
            <button class="lang-item" data-lang="ru"   onclick="setLang('ru')"><span class="flag">🇷🇺</span> Русский</button>
        </div>
    </div>
</div>

<!-- CHAT (always visible — welcome is the first bot bubble) -->
<div class="chat">
    <div class="messages" id="messages"></div>
</div>

<!-- INPUT -->
<div class="input-area">
    <div class="input-shell">
        <textarea class="input-field" id="input" rows="1" placeholder="ถามทรายได้เลย · Ask Sand…" oninput="autoResize(this); updateSend()" onkeydown="onKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
</div>

<div class="footer">
    <span id="ftBrand">Sand · M Vision Public Company Limited</span> ·
    <a href="https://thailandboatfestival.com" target="_blank">thailandboatfestival.com</a>
</div>

        splash: 'Сэнд готовится…',

        brand: 'Sand · M Vision Public Company Limited',
        welcome: 'Добрый день. Я Сэнд, AI-консьерж Thailand Boat Festival 2027.\n\nГотова содействовать в вопросах посещения, представления бренда или яхты, спонсорства, а также по иным деталям мероприятия. Чем могу быть полезна сегодня?',

};
const LANG_LABEL = { auto: '🌐 Auto', th: '🇹🇭 ไทย', en: '🇬🇧 EN', zh: '🇨🇳 中文', ja: '🇯🇵 日本語', ko: '🇰🇷 한국어', vi: '🇻🇳 VI', ru: '🇷🇺 RU' };

/* ─── STATE ─── */
let langPref = localStorage.getItem('sand_lang') || 'en';
let currentLang = 'en';
let history = [];
let isWaiting = false;
let welcomeShown = false;  // tracks whether we've shown the initial greeting

/* ─── LANGUAGE ─── */
function detectBrowserLang() {
    const list = navigator.languages?.length ? navigator.languages : [navigator.language || 'en'];
    for (const raw of list) {
        const code = (raw || '').toLowerCase().split('-')[0];
        if (COPY[code]) return code;
    }
    return 'en';
}
function effectiveLang() { return langPref === 'auto' ? detectBrowserLang() : langPref; }
function setLang(lang) {
    const prevLang = currentLang;
    langPref = lang;
    localStorage.setItem('sand_lang', lang);
    currentLang = effectiveLang();
    applyCopy();
    document.getElementById('langMenu').classList.remove('open');
    document.querySelectorAll('.lang-item').forEach(i => i.classList.toggle('active', i.dataset.lang === lang));

    // If user changed language before sending anything, refresh the welcome greeting
    if (welcomeShown && history.length === 0 && currentLang !== prevLang) {
        document.getElementById('messages').innerHTML = '';
        welcomeShown = false;
        showWelcomeBot();
    }
}
function toggleLangMenu(e) {
    e?.stopPropagation();
    document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', e => {
    if (!e.target.closest('.lang-wrap')) document.getElementById('langMenu').classList.remove('open');
});

function applyCopy() {
    const c = COPY[currentLang] || COPY.en;
    document.getElementById('barH1').textContent     = c.h1;
    document.getElementById('barSub').textContent    = c.sub;
    document.getElementById('input').placeholder     = c.placeholder;
    document.getElementById('ftBrand').textContent   = c.brand;
    document.getElementById('langLabel').textContent = LANG_LABEL[langPref] || LANG_LABEL.auto;
    const sl = document.getElementById('splashLabel');
    if (sl && c.splash) sl.textContent = c.splash;
    document.documentElement.setAttribute('lang', currentLang);
}

/* ─── CHAT ─── */
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function updateSend() {
    const v = document.getElementById('input').value.trim();
    document.getElementById('sendBtn').disabled = !v || isWaiting;
}
function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function quickAsk(text) {
    const inp = document.getElementById('input');
    inp.value = text;
    autoResize(inp);
    updateSend();
    send();
}
function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function addMsg(text, role) {
    const cont = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (role === 'bot') {
        wrap.innerHTML = `<img src="images/sand_profile_pic.png" class="msg-av" alt="">
                          <div class="bubble">${escapeHtml(text)}</div>`;
    } else {
        const c = COPY[currentLang] || COPY.en;
        const youLabel = c.you || 'You';
        wrap.innerHTML = `
            <div class="user-stack">
                <div class="user-label">${escapeHtml(youLabel)}</div>
                <div class="bubble">${escapeHtml(text)}</div>
            </div>
            <img src="images/user_avatar_beach.svg" class="msg-av" alt="">`;
    }
    cont.appendChild(wrap);
    cont.scrollTop = cont.scrollHeight;
    return wrap;
}
function showTyping() {
    const cont = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg bot typing-msg'; wrap.id = 'typing';
    wrap.innerHTML = `<img src="images/sand_profile_pic.png" class="msg-av" alt="">
        <div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    cont.appendChild(wrap);
    cont.scrollTop = cont.scrollHeight;
}
function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
}

/* ─── WELCOME BOT (auto-injected first message — like Fah) ─── */
function showWelcomeBot() {
    if (welcomeShown) return;
    welcomeShown = true;
    const c = COPY[currentLang] || COPY.en;
    addMsg(c.welcome, 'bot');
    addSuggestions(c.chips);
}

/* ─── SUGGESTION CHIPS ─── */
function addSuggestions(questions) {
    if (!Array.isArray(questions) || !questions.length) return;
    document.querySelectorAll('.suggestions').forEach(el => el.remove());
    const cont = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'suggestions';
    wrap.innerHTML = questions.slice(0, 4).map(q => {
        const safe = String(q).trim().slice(0, 160);
        const attr = JSON.stringify(safe).replace(/"/g, '&quot;');
        return `<button class="suggest-chip" type="button" onclick="quickAsk(${attr})">${escapeHtml(safe)}</button>`;
    }).join('');
    cont.appendChild(wrap);
    cont.scrollTop = cont.scrollHeight;
}
document.getElementById('input').addEventListener('input', () => {
    document.querySelectorAll('.suggestions').forEach(el => el.remove());
});

/* ─── CONVERSATION ID + RESTORE ─── */
function getConversationId() {
    let id = sessionStorage.getItem('sand_conv_id');
    if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
             ('c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
        sessionStorage.setItem('sand_conv_id', id);
    }
    return id;
}
async function restoreChat() {
    const id = sessionStorage.getItem('sand_conv_id');
    if (!id) { showWelcomeBot(); return; }
    try {
        const r = await fetch('/.netlify/functions/get-conversation?id=' + encodeURIComponent(id));
        if (!r.ok) { showWelcomeBot(); return; }
        const d = await r.json();
        const msgs = (d.messages || []).filter(m => m.content && m.content.trim());
        if (!msgs.length) { showWelcomeBot(); return; }
        welcomeShown = true;  // prevent welcome injection on restored convs
        history = msgs.map(m => ({ role: m.role, content: m.content }));
        for (const m of msgs) addMsg(m.content, m.role === 'user' ? 'user' : 'bot');
    } catch (_) { showWelcomeBot(); }
}

/* ─── SEND ─── */
async function send() {
    if (isWaiting) return;
    const inp = document.getElementById('input');
    const text = inp.value.trim();
    if (!text) return;

    welcomeShown = true;  // any send guarantees welcome won't re-inject
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });
    inp.value = ''; autoResize(inp); updateSend();

    isWaiting = true;
    showTyping();
    try {
        const res = await fetch('/.netlify/functions/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history, conversationId: getConversationId() })
        });
        const data = await res.json();
        removeTyping();

        const replyRaw = data.reply || '';
        const leadMatch = replyRaw.match(/\[LEAD_CARD\]([\s\S]*?)\[\/LEAD_CARD\]/);
        const nextMatch = replyRaw.match(/\[NEXT_QUESTIONS\]([\s\S]*?)\[\/NEXT_QUESTIONS\]/);

        const prose = replyRaw
            .replace(/\[LEAD_CARD\][\s\S]*?\[\/LEAD_CARD\]/, '')
            .replace(/\[NEXT_QUESTIONS\][\s\S]*?\[\/NEXT_QUESTIONS\]/, '')
            .trim();

        if (leadMatch) {
            if (prose) addMsg(prose, 'bot');
            try {
                const lead = JSON.parse(leadMatch[1].trim());
                addLeadCard(lead);
            } catch (_) {
                if (!prose) addMsg(replyRaw, 'bot');
            }
        } else if (prose) {
            addMsg(prose, 'bot');
        }

        if (nextMatch && !leadMatch) {
            try {
                const qs = JSON.parse(nextMatch[1].trim());
                if (Array.isArray(qs) && qs.length) addSuggestions(qs);
            } catch (_) {}
        }

        history.push({ role: 'assistant', content: prose });
    } catch (err) {
        removeTyping();
        addMsg('⚠️  ' + (err.message || 'Connection error.'), 'bot');
    } finally {
        isWaiting = false;
        updateSend();
        // DON'T auto-focus input — let user read the reply + suggestion chips
        // without the mobile keyboard popping up and blocking the content.
        // Keyboard only appears when user manually taps the input field.
    }
}

/* ─── LEAD CARD ─── */
function addLeadCard(d) {
    const c = COPY[currentLang] || COPY.en;
    const labels = {
        h: { en: 'CONFIRM YOUR DETAILS', th: 'ยืนยันข้อมูลของคุณ', zh: '请确认您的信息', ja: '内容のご確認', ko: '입력 정보 확인', vi: 'XÁC NHẬN THÔNG TIN', ru: 'ПОДТВЕРЖДЕНИЕ ДАННЫХ' }[currentLang] || 'CONFIRM YOUR DETAILS',
        confirm: { en: '✓  Confirm', th: '✓  ยืนยัน', zh: '✓  确认', ja: '✓  確定', ko: '✓  확인', vi: '✓  Xác nhận', ru: '✓  Подтвердить' }[currentLang] || '✓  Confirm',
        edit: { en: '✎  Edit', th: '✎  แก้ไข', zh: '✎  修改', ja: '✎  修正', ko: '✎  수정', vi: '✎  Sửa', ru: '✎  Изменить' }[currentLang] || '✎  Edit',
        sent: { en: '✓  Sent — our team will be in touch shortly.', th: '✓  ส่งแล้ว — ทีมจะติดต่อกลับเร็วๆ นี้ค่ะ', zh: '✓  已送出 — 我们的团队将尽快与您联系', ja: '✓  送信完了 — チームより折り返しご連絡いたします', ko: '✓  전송 완료 — 팀에서 곧 연락드릴게요', vi: '✓  Đã gửi — Đội ngũ sẽ liên hệ với bạn sớm.', ru: '✓  Отправлено — команда скоро свяжется с вами.' }[currentLang] || '✓  Sent'
    };
    const cont = document.getElementById('messages');
    const rows = [
        d.name     && { k: 'Name',     v: d.name },
        d.email    && { k: 'Email',    v: d.email },
        d.company  && { k: 'Company',  v: d.company },
        d.interest && { k: 'Interest', v: d.interest },
        d.package  && { k: 'Package',  v: d.package },
        d.cash     && { k: 'Cash',     v: 'THB ' + d.cash },
        d.barter   && { k: 'Barter',   v: d.barter + (d.barter_value ? ` (THB ${d.barter_value}${d.barter_pct ? `, ${d.barter_pct}%` : ''})` : '') },
        d.note     && { k: 'Note',     v: d.note }
    ].filter(Boolean);
    const rowsHtml = rows.map(r =>
        `<div class="lead-row"><span class="k">${escapeHtml(r.k)}</span><span class="v">${escapeHtml(r.v)}</span></div>`
    ).join('');
    const dataStr = encodeURIComponent(JSON.stringify(d));
    const card = document.createElement('div');
    card.className = 'msg bot';
    card.innerHTML = `<img src="images/sand_profile_pic.png" class="msg-av" alt="">
        <div class="lead-card">
            <div class="lead-card-h">${labels.h}</div>
            ${rowsHtml}
            <div class="lead-actions">
                <button class="btn-confirm" onclick="confirmLead('${dataStr}', this)">${labels.confirm}</button>
                <button class="btn-edit" onclick="editLead()">${labels.edit}</button>
            </div>
            <div class="lead-sent">${labels.sent}</div>
        </div>`;
    cont.appendChild(card);
    cont.scrollTop = cont.scrollHeight;
}
async function confirmLead(dataStr, btn) {
    const card = btn.closest('.lead-card');
    btn.disabled = true; btn.textContent = '…';
    try {
        const lead = JSON.parse(decodeURIComponent(dataStr));
        await fetch('/.netlify/functions/send-lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(lead)
        });
        card.classList.add('sent');
    } catch (_) {
        btn.disabled = false;
        btn.textContent = '✓ Confirm';
    }
}
function editLead() {
    const inp = document.getElementById('input');
    inp.value = (currentLang === 'th') ? 'ขอแก้ข้อมูลนิดนึงค่ะ' : "I'd like to edit my details.";
    inp.focus(); updateSend();
}

/* ─── SPLASH HIDE — linger ~2s so users see Sand's portrait first ─── */
async function hideSplash() {
    const splash = document.getElementById('splash');
    if (!splash) return;
    try { await document.fonts.ready; } catch (_) {}
    await new Promise(r => setTimeout(r, 3000));
    splash.classList.add('hidden');
    setTimeout(() => splash.remove(), 600);
}

/* ─── INIT ─── */
currentLang = effectiveLang();
applyCopy();
document.querySelectorAll('.lang-item').forEach(i => i.classList.toggle('active', i.dataset.lang === langPref));
restoreChat();
hideSplash();
</script>
