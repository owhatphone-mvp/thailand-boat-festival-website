<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Thailand Boat Festival 2027 — ทราย พร้อมช่วย</title>
<meta name="description" content="Sand · AI Concierge for Thailand Boat Festival 2027 at Boat Lagoon Marina, Phuket. Ask in any language.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
    --bg:         #fafbf7;
    --bg-card:    #ffffff;
    --bg-soft:    #f4f0e6;
    --ink:        #0b1220;
    --ink-soft:   #5d6470;
    --ink-faint:  #9ca3af;
    --line:       #e8e6dc;
    --line-strong:#d8d4c3;
    --gold:       #b8902e;
    --gold-soft:  #d9b558;
    --user-bg:    #0b1220;
    --user-fg:    #ffffff;
    --bot-bg:     #ffffff;
    --bot-fg:     #0b1220;
    --shadow-sm:  0 1px 2px rgba(11,18,32,0.04), 0 1px 1px rgba(11,18,32,0.03);
    --shadow-md:  0 4px 14px rgba(11,18,32,0.06), 0 1px 3px rgba(11,18,32,0.04);
    --radius-sm:  10px;
    --radius-md:  16px;
    --radius-lg:  22px;
    --font:       'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    display: flex; flex-direction: column;
    overflow-x: hidden;
}

/* ─── HEADER ─── */
.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.1rem;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 20;
}
.bar-left { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
.bar-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    object-fit: cover; border: 1.5px solid var(--gold-soft);
    flex-shrink: 0;
}
.bar-titles { min-width: 0; }
.bar-h1 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; }
.bar-sub { font-size: 0.72rem; color: var(--ink-soft); margin-top: 1px; line-height: 1.1; }

.lang-wrap { position: relative; }
.lang-btn {
    padding: 0.42rem 0.75rem 0.42rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--bg-card);
    font-family: var(--font); font-size: 0.78rem; font-weight: 500;
    color: var(--ink); cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 0.35rem;
}
.lang-btn:hover { border-color: var(--gold-soft); }
.lang-btn .caret { font-size: 0.6rem; opacity: 0.5; }
.lang-menu {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    min-width: 180px; padding: 0.3rem;
    display: none; z-index: 30;
    max-height: 70vh; overflow-y: auto;
}
.lang-menu.open { display: block; }
.lang-item {
    width: 100%; text-align: left;
    padding: 0.55rem 0.7rem; border: 0; background: transparent;
    border-radius: 6px;
    font-family: var(--font); font-size: 0.85rem; color: var(--ink);
    cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
}
.lang-item:hover { background: var(--bg-soft); }
.lang-item.active { background: var(--bg-soft); font-weight: 600; }
.lang-item .flag { font-size: 1rem; }

/* ─── WELCOME ─── */
.welcome {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 2rem 1.2rem 1.5rem;
    max-width: 640px; width: 100%; margin: 0 auto;
}
.welcome.hidden { display: none; }
.welcome-portrait {
    width: 180px; height: 180px; border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold-soft);
    box-shadow: var(--shadow-md), 0 0 0 8px rgba(184,144,46,0.06);
    margin-bottom: 1.5rem;
}
.welcome-name { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
.welcome-role {
    margin-top: 0.3rem;
    font-size: 0.92rem; color: var(--ink-soft);
}
.welcome-tagline {
    margin-top: 1.1rem;
    font-size: 0.88rem; color: var(--ink-soft);
    padding: 0.55rem 1rem;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 999px;
    display: inline-block;
}

.chips {
    margin: 1.8rem 0 1rem;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.65rem; width: 100%; max-width: 560px;
}
.chip {
    text-align: left;
    padding: 0.85rem 1rem;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
    color: var(--ink);
    display: flex; align-items: flex-start; gap: 0.6rem;
    box-shadow: var(--shadow-sm);
}
.chip:hover { border-color: var(--gold-soft); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.chip .icon { font-size: 1.15rem; flex-shrink: 0; line-height: 1.3; }
.chip .label { font-size: 0.86rem; font-weight: 500; line-height: 1.3; }

/* ─── CHAT ─── */
.chat {
    flex: 1; display: none; flex-direction: column;
    max-width: 720px; width: 100%; margin: 0 auto;
    padding: 0 1rem;
    overflow: hidden;
}
.chat.active { display: flex; }
.messages {
    flex: 1; overflow-y: auto;
    padding: 1.2rem 0 1rem;
    display: flex; flex-direction: column; gap: 0.8rem;
    scroll-behavior: smooth;
}
.msg { display: flex; gap: 0.55rem; max-width: 100%; }
.msg.user { justify-content: flex-end; }
.msg-av {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0; object-fit: cover; border: 1px solid var(--line);
    align-self: flex-end; margin-bottom: 2px;
}
.msg-bubble {
    padding: 0.7rem 0.95rem;
    border-radius: var(--radius-md);
    font-size: 0.94rem; line-height: 1.5;
    max-width: calc(100% - 50px);
    word-wrap: break-word; white-space: pre-wrap;
}
.msg.bot .msg-bubble {
    background: var(--bot-bg); color: var(--bot-fg);
    border: 1px solid var(--line);
    border-top-left-radius: 6px;
}
.msg.user .msg-bubble {
    background: var(--user-bg); color: var(--user-fg);
    border-top-right-radius: 6px;
}
.typing-label { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 0.35rem; }
.dots { display: inline-flex; gap: 4px; }
.dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint);
    animation: dot-pulse 1.3s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-pulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); } 30% { opacity: 1; transform: scale(1); } }

/* ─── LEAD CARD ─── */
.lead-card {
    margin: 0.4rem 0;
    background: var(--bg-card);
    border: 1px solid var(--gold-soft);
    border-radius: var(--radius-md);
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow-md);
}
.lead-card-h {
    font-size: 0.74rem; color: var(--gold); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 0.7rem;
}
.lead-row { display: flex; gap: 0.5rem; padding: 0.32rem 0; font-size: 0.88rem; line-height: 1.4; }
.lead-row .k { color: var(--ink-soft); min-width: 78px; flex-shrink: 0; }
.lead-row .v { font-weight: 500; }
.lead-actions { display: flex; gap: 0.5rem; margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid var(--line); }
.btn-confirm, .btn-edit {
    flex: 1; padding: 0.7rem 1rem;
    border: 0; border-radius: var(--radius-sm);
    font-family: var(--font); font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
}
.btn-confirm { background: var(--ink); color: #fff; }
.btn-confirm:hover { background: #1a2336; }
.btn-edit { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.btn-edit:hover { border-color: var(--ink-soft); color: var(--ink); }
.lead-sent { display: none; padding: 0.85rem; text-align: center; color: #2d7a4f; font-weight: 600; background: #ecf7ee; border-radius: var(--radius-sm); margin-top: 0.85rem; font-size: 0.9rem; }
.lead-card.sent .lead-actions { display: none; }
.lead-card.sent .lead-sent { display: block; }

/* ─── INPUT ─── */
.input-area {
    width: 100%;
    padding: 0.7rem 1rem 1rem;
    border-top: 1px solid var(--line);
    background: var(--bg);
    max-width: 720px; margin: 0 auto;
}
.input-shell {
    display: flex; align-items: flex-end; gap: 0.5rem;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 0.5rem 0.55rem 0.5rem 1rem;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.input-shell:focus-within { border-color: var(--gold-soft); box-shadow: 0 0 0 3px rgba(184,144,46,0.08); }
.input-field {
    flex: 1;
    border: 0; outline: 0; background: transparent;
    font-family: var(--font); font-size: 0.95rem; color: var(--ink);
    padding: 0.4rem 0; resize: none;
    max-height: 120px; line-height: 1.4;
}
.input-field::placeholder { color: var(--ink-faint); }
.send-btn {
    width: 38px; height: 38px; border: 0; border-radius: 50%;
    background: var(--ink); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
}
.send-btn:disabled { background: var(--line-strong); cursor: not-allowed; }
.send-btn:not(:disabled):hover { transform: scale(1.05); }
.send-btn svg { width: 16px; height: 16px; }

.footer {
    text-align: center;
    padding: 0.7rem 1rem;
    font-size: 0.7rem; color: var(--ink-faint);
    border-top: 1px solid var(--line);
    background: var(--bg);
}
.footer a { color: var(--ink-soft); text-decoration: none; }
.footer a:hover { color: var(--gold); }

/* ─── MOBILE ─── */
@media (max-width: 520px) {
    .welcome-portrait { width: 140px; height: 140px; }
    .welcome-name { font-size: 1.35rem; }
    .chips { grid-template-columns: 1fr; }
    .bar-h1 { font-size: 0.88rem; }
    .bar-sub { font-size: 0.68rem; }
}
</style>
</head>

            { i: '✨', t: 'Cơ hội tài trợ',                q: 'Tôi quan tâm đến cơ hội tài trợ cho TBF' },
            { i: '🌊', t: 'Về lễ hội',                     q: 'Hãy kể cho tôi nghe về Thailand Boat Festival 2027' }
        ]
    },
    ru: {
        h1: 'AI-консьерж', sub: 'Thailand Boat Festival 2027',
        wName: 'Сэнд / Sand', wRole: 'AI-консьерж · Thailand Boat Festival 2027',
        wTagline: 'Спрашивайте Сэнд на любом языке',
        placeholder: 'Спросите Сэнд…',
        typing: 'Сэнд печатает…', searching: '🔍 Идёт поиск…',
        brand: 'Sand · M Vision Public Company Limited',
        lead: { h: 'ПОДТВЕРЖДЕНИЕ ДАННЫХ', confirm: '✓  Подтвердить', edit: '✎  Изменить', sent: '✓  Отправлено — команда скоро свяжется с вами.' },
        chips: [
            { i: '⛵', t: 'Планирую посетить',              q: 'Я планирую посетить фестиваль TBF' },
            { i: '🛥️', t: 'Представить бренд или яхту',    q: 'Хочу представить бренд или яхту на TBF' },
            { i: '✨', t: 'Спонсорство',                    q: 'Меня интересует спонсорство TBF' },
            { i: '🌊', t: 'О фестивале',                    q: 'Расскажите про Thailand Boat Festival 2027' }
        ]
    }
};
const LANG_LABEL = { auto: '🌐 Auto', th: '🇹🇭 ไทย', en: '🇬🇧 EN', zh: '🇨🇳 中文', ja: '🇯🇵 日本語', ko: '🇰🇷 한국어', vi: '🇻🇳 VI', ru: '🇷🇺 RU' };

/* ─── STATE ─── */
let langPref = localStorage.getItem('sand_lang') || 'auto';
let currentLang = 'en';
let history = [];
let isWaiting = false;

/* ─── LANGUAGE ─── */
function detectBrowserLang() {
    const list = navigator.languages?.length ? navigator.languages : [navigator.language || 'en'];
    for (const raw of list) {
        const code = (raw || '').toLowerCase().split('-')[0];
        if (COPY[code]) return code;
    }
    return 'en';
}
function effectiveLang() { return langPref === 'auto' ? detectBrowserLang() : langPref; }
function setLang(lang) {
    langPref = lang;
    localStorage.setItem('sand_lang', lang);
    currentLang = effectiveLang();
    applyCopy();
    document.getElementById('langMenu').classList.remove('open');
    document.querySelectorAll('.lang-item').forEach(i => i.classList.toggle('active', i.dataset.lang === lang));
}
function toggleLangMenu(e) {
    e?.stopPropagation();
    document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', e => {
    if (!e.target.closest('.lang-wrap')) document.getElementById('langMenu').classList.remove('open');
});

function applyCopy() {
    const c = COPY[currentLang] || COPY.en;
    document.getElementById('barH1').textContent     = c.h1;
    document.getElementById('barSub').textContent    = c.sub;
    document.getElementById('wName').textContent     = c.wName;
    document.getElementById('wRole').textContent     = c.wRole;
    document.getElementById('wTagline').textContent  = c.wTagline;
    document.getElementById('input').placeholder     = c.placeholder;
    document.getElementById('ftBrand').textContent   = c.brand;
    document.getElementById('langLabel').textContent = LANG_LABEL[langPref] || LANG_LABEL.auto;
    document.documentElement.setAttribute('lang', currentLang);
    renderChips(c.chips);
}
function renderChips(chips) {
    const wrap = document.getElementById('chips');
    wrap.innerHTML = chips.map(c =>
        `<button class="chip" onclick="quickAsk(${JSON.stringify(c.q).replace(/"/g, '&quot;')})">
            <span class="icon">${c.i}</span><span class="label">${c.t}</span>
        </button>`
    ).join('');
}

/* ─── CHAT ─── */
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function updateSend() {
    const v = document.getElementById('input').value.trim();
    document.getElementById('sendBtn').disabled = !v || isWaiting;
}
function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function quickAsk(text) {
    const inp = document.getElementById('input');
    inp.value = text;
    autoResize(inp);
    updateSend();
    send();
}
function showWelcome(show) {
    document.getElementById('welcome').classList.toggle('hidden', !show);
    document.getElementById('chat').classList.toggle('active', !show);
}
function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function addMsg(text, role) {
    const cont = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const av = role === 'bot' ? `<img src="images/sand_profile_pic.png" class="msg-av" alt="">` : '';
    wrap.innerHTML = `${av}<div class="msg-bubble">${escapeHtml(text)}</div>`;
    cont.appendChild(wrap);
    cont.scrollTop = cont.scrollHeight;
    return wrap;
}
function showTyping() {
    const c = COPY[currentLang] || COPY.en;
    const cont = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg bot'; wrap.id = 'typing';
    wrap.innerHTML = `<img src="images/sand_profile_pic.png" class="msg-av" alt="">
        <div class="msg-bubble">
            <div class="typing-label">${c.typing}</div>
            <div class="dots"><span></span><span></span><span></span></div>
        </div>`;
    cont.appendChild(wrap);
    cont.scrollTop = cont.scrollHeight;
}
function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
}

/* ─── CONVERSATION ID + RESTORE ─── */
function getConversationId() {
    let id = sessionStorage.getItem('sand_conv_id');
    if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
             ('c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
        sessionStorage.setItem('sand_conv_id', id);
    }
    return id;
}
async function restoreChat() {
    const id = sessionStorage.getItem('sand_conv_id');
    if (!id) return;
    try {
        const r = await fetch('/.netlify/functions/get-conversation?id=' + encodeURIComponent(id));
        if (!r.ok) return;
        const d = await r.json();
        const msgs = (d.messages || []).filter(m => m.content && m.content.trim());
        if (!msgs.length) return;
        showWelcome(false);
        history = msgs.map(m => ({ role: m.role, content: m.content }));
        for (const m of msgs) addMsg(m.content, m.role === 'user' ? 'user' : 'bot');
    } catch (_) {}
}

/* ─── SEND ─── */
async function send() {
    if (isWaiting) return;
    const inp = document.getElementById('input');
    const text = inp.value.trim();
    if (!text) return;

    showWelcome(false);
    addMsg(text, 'user');
    history.push({ role: 'user', content: text });
    inp.value = ''; autoResize(inp); updateSend();

    isWaiting = true;
    showTyping();
    try {
        const res = await fetch('/.netlify/functions/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history, conversationId: getConversationId() })
        });
        const data = await res.json();
        removeTyping();

        const replyRaw = data.reply || '';
        const leadMatch = replyRaw.match(/\[LEAD_CARD\]([\s\S]*?)\[\/LEAD_CARD\]/);

        if (leadMatch) {
            const before = replyRaw.slice(0, replyRaw.indexOf('[LEAD_CARD]')).trim();
            if (before) addMsg(before, 'bot');
            try {
                const lead = JSON.parse(leadMatch[1].trim());
                addLeadCard(lead);
            } catch (_) {
                addMsg(replyRaw, 'bot');
            }
        } else if (replyRaw) {
            addMsg(replyRaw, 'bot');
        }

        // Track only the visible part in history (strip LEAD tag)
        history.push({ role: 'assistant', content: replyRaw.replace(/\[LEAD_CARD\][\s\S]*?\[\/LEAD_CARD\]/, '').trim() });
    } catch (err) {
        removeTyping();
        addMsg('⚠️  ' + (err.message || 'Connection error.'), 'bot');
    } finally {
        isWaiting = false;
        updateSend();
        document.getElementById('input').focus();
    }
}

/* ─── LEAD CARD ─── */
function addLeadCard(d) {
    const c = COPY[currentLang] || COPY.en;
    const cont = document.getElementById('messages');
    const rows = [
        d.name     && { k: 'Name',     v: d.name },
        d.email    && { k: 'Email',    v: d.email },
        d.company  && { k: 'Company',  v: d.company },
        d.interest && { k: 'Interest', v: d.interest },
        d.package  && { k: 'Package',  v: d.package },
        d.cash     && { k: 'Cash',     v: 'THB ' + d.cash },
        d.barter   && { k: 'Barter',   v: d.barter + (d.barter_value ? ` (THB ${d.barter_value}${d.barter_pct ? `, ${d.barter_pct}%` : ''})` : '') },
        d.note     && { k: 'Note',     v: d.note }
    ].filter(Boolean);
    const rowsHtml = rows.map(r =>
        `<div class="lead-row"><span class="k">${escapeHtml(r.k)}</span><span class="v">${escapeHtml(r.v)}</span></div>`
    ).join('');
    const dataStr = encodeURIComponent(JSON.stringify(d));
    const card = document.createElement('div');
    card.className = 'msg bot';
    card.innerHTML = `<img src="images/sand_profile_pic.png" class="msg-av" alt="">
        <div class="lead-card" id="leadCard" style="max-width:calc(100% - 50px);">
            <div class="lead-card-h">${c.lead.h}</div>
            ${rowsHtml}
            <div class="lead-actions">
                <button class="btn-confirm" onclick="confirmLead('${dataStr}', this)">${c.lead.confirm}</button>
                <button class="btn-edit" onclick="editLead()">${c.lead.edit}</button>
            </div>
            <div class="lead-sent">${c.lead.sent}</div>
        </div>`;
    cont.appendChild(card);
    cont.scrollTop = cont.scrollHeight;
}
async function confirmLead(dataStr, btn) {
    const card = btn.closest('.lead-card');
    btn.disabled = true; btn.textContent = '…';
    try {
        const lead = JSON.parse(decodeURIComponent(dataStr));
        await fetch('/.netlify/functions/send-lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(lead)
        });
        card.classList.add('sent');
    } catch (_) {
        btn.disabled = false; btn.textContent = (COPY[currentLang] || COPY.en).lead.confirm;
    }
}
function editLead() {
    const inp = document.getElementById('input');
    inp.value = (currentLang === 'th') ? 'ขอแก้ข้อมูลนิดนึงค่ะ' : 'I\'d like to edit my details.';
    inp.focus(); updateSend();
}

/* ─── INIT ─── */
currentLang = effectiveLang();
applyCopy();
document.querySelectorAll('.lang-item').forEach(i => i.classList.toggle('active', i.dataset.lang === langPref));
restoreChat();
</script>
</body>
</html>
